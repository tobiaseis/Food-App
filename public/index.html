<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101310" media="(prefers-color-scheme: dark)">
  <title>Madplan · ugens retter bygget på tilbud</title>
  <meta name="description" content="Ugentlige madplaner bygget på de varer, der faktisk er på tilbud i dine egne butikker – med prishistorik og varenotifikationer.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Samme mærke som launcher-ikonet: et prisskilt. Formen kan læses ved
       16 px, hvor et stykke mad ville blive til grød. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d4b38'/><path d='M16.6 7H24a1 1 0 0 1 1 1v7.4a2 2 0 0 1-.6 1.4l-7.6 7.6a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l7.6-7.6a2 2 0 0 1 1.4-.6z' fill='none' stroke='%23fff' stroke-width='2'/><circle cx='20.4' cy='11.6' r='1.6' fill='%23fff'/></svg>">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <!-- Mærket er en dokke: navnet, og den uge tallene på siden gælder for.
           Ugen sættes af app.js, så den aldrig kan stå forkert i en fane,
           der har været åben natten over. -->
      <a class="brand" href="#/plan">
        <span class="brand-name">Madplan</span>
        <span class="brand-week" id="brand-week"></span>
      </a>

      <!-- Samme <nav> begge steder: på brede skærme en pille-række i toppen,
           under 720px en fast bundlinje inden for tommelfingerens rækkevidde.
           Ét sæt links betyder ét sted at vedligeholde ruterne – app.js'
           router kender kun "#tabs a" og skal ikke vide hvor de står. -->
      <nav class="tabs" id="tabs">
        <a href="#/plan">
          <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 14.6l2.2 2.2 4.3-4.4"/></svg>
          <span class="tab-label">Madplan</span>
        </a>
        <a href="#/deals">
          <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 3H20a1 1 0 0 1 1 1v7.4a2 2 0 0 1-.6 1.4l-7.6 7.6a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l7.6-7.6a2 2 0 0 1 1.4-.6z"/><circle cx="16.4" cy="7.6" r="1.4"/></svg>
          <span class="tab-label">Ugens fund</span>
        </a>
        <a href="#/offers">
          <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></svg>
          <span class="tab-label">Alle tilbud</span>
        </a>
        <a href="#/watch">
          <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.6a6 6 0 1 0-12 0c0 5.2-2 6.7-2 6.7h16s-2-1.5-2-6.7z"/><path d="M13.7 19.3a2 2 0 0 1-3.4 0"/></svg>
          <span class="tab-label">Følg varer</span>
          <span class="badge-count" id="watch-badge" hidden></span>
        </a>
        <a href="#/settings">
          <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></svg>
          <span class="tab-label">Indstillinger</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="app"><div class="loading">Indlæser…</div></main>

  <!-- Foden hører hjemmesiden til. I en installeret app er der ingen
       hjemmeside at gå ned i foden af, så CSS skjuler den i standalone. -->
  <footer class="site">
    <div class="site-inner">
      <span>Ugens retter bygget på danske supermarkeders tilbudsaviser.</span>
      <span id="site-updated"></span>
      <a href="/privatliv">Privatliv</a>
    </div>
  </footer>

  <dialog id="modal">
    <div class="dlg-head">
      <div class="spread">
        <h2 id="modal-title"></h2>
        <button class="ghost" id="modal-close">Luk</button>
      </div>
    </div>
    <div class="dlg-body" id="modal-body"></div>
  </dialog>

  <script src="/config.js"></script>
  <!-- Madplans-motoren. Samme fil kører i Node (src/mealplan/generate.js). -->
  <script src="/engine.js"></script>
  <!-- Broen til den native skal. Stille no-op i en almindelig browser,
       men data.js og app.js kalder den, så den skal ligge før dem. -->
  <script src="/native.js"></script>
  <!-- Anonymt login. Skal ligge før data.js, som sætter Authorization-
       headeren ud fra Auth.token(). -->
  <script src="/auth.js"></script>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
