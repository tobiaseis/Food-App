name: Hent tilbud og opdatér Supabase

on:
  schedule:
    # 05:10 UTC dagligt. Kæderne udgiver ikke aviser på samme ugedag, og
    # kørslen er idempotent (nøglet på Tjeks offer-id), så daglig kørsel
    # koster ingenting og sikrer, at ingen uge går tabt.
    # Bemærk: GitHub kan forsinke planlagte jobs 15-30 min i spidsbelastning.
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      crawl_recipes:
        description: 'Hent også nye opskrifter (tager ~20 min)'
        type: boolean
        default: false

# Databasen er én fil – to samtidige kørsler ville overskrive hinanden.
concurrency:
  group: madplan-update
  cancel-in-progress: false

permissions:
  contents: write        # til at gemme databasen som release-asset

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installér afhængigheder
        run: npm ci --omit=optional

      # Prishistorikken er hele pointen med appen, så databasen skal overleve
      # mellem kørsler. Den gemmes som release-asset frem for i git: et 12 MB
      # binært commit om dagen ville sprænge repoet på et år.
      - name: Hent database fra release
        run: |
          gh release view db >/dev/null 2>&1 || \
            gh release create db --title "Database" --notes "SQLite-snapshot. Overskrives af den daglige kørsel."
          gh release download db --pattern data.db --clobber 2>/dev/null \
            && echo "Database hentet ($(du -h data.db | cut -f1))" \
            || echo "Ingen database endnu – der bygges en ny"

      - name: Hent opskrifter (kun hvis basen er tom eller efterspurgt)
        run: |
          COUNT=$(node -e "
            const fs=require('fs');
            if(!fs.existsSync('data.db')){console.log(0);process.exit(0)}
            try{
              const db=require('better-sqlite3')('data.db',{readonly:true});
              console.log(db.prepare('SELECT COUNT(*) n FROM recipes').get().n);
            }catch{console.log(0)}
          ")
          echo "Opskrifter i basen: $COUNT"
          if [ "$COUNT" -lt 200 ] || [ "${{ inputs.crawl_recipes }}" = "true" ]; then
            echo "Henter opskrifter..."
            npm run recipes
            node src/recipes/backfill-images.js
            npm run reclassify
          else
            echo "Springer opskrifts-crawl over"
          fi

      - name: Hent denne uges tilbudsaviser
        run: npm run update

      # Uden dette trin står `items`-tabellen tom i CI, og hver eneste
      # opslag falder tilbage til taxonomy.js' SEED-konstant i stedet – det
      # virker i dag, men er blindt for enhver fremmednøgle mod items, som
      # næste plan lægger på (og coverage-report.js's LEFT JOIN items ville
      # ikke se noget). Kør altid, ikke kun når opskrifter blev hentet: en
      # base hentet fra release-assetet kan have item_key fra taxonomy_key
      # (se migrate() i src/db/index.js), men aldrig en fyldt items-tabel før
      # dette har kørt mindst én gang.
      - name: Sørg for varetaksonomi og materialiserede mængder
        run: |
          npm run seed:items
          npm run backfill:amounts

      # Priserne. Uden dette trin pushede den natlige kørsel nattens tilbud
      # ved siden af en `recipe_costs`, der blev regnet den dag, nogen sidst
      # huskede at køre scriptet i hånden — og `data/item_prices.csv`, som
      # ligger i git netop for at prisændringer kan ses i en diff, blev aldrig
      # læst ind i basen overhovedet.
      #
      # Rækkefølgen er ikke valgfri:
      #   prices:import     de indtastede priser ind først. De er den højeste
      #                     tillidskilde og må stå, når gættene bygges.
      #   prices:bootstrap  gætter normalpriser ud fra tilbudshistorikken og
      #                     genopbygger hele 'derived'-laget. Skal køre EFTER
      #                     ingesten, så nattens tilbud er med.
      #   costs:recompute   læser begge dele og skal derfor køre sidst.
      #
      # Om værnet i bootstrap ("nægter at slette, når der ikke skrives noget"):
      # det måler tilbud inden for 400 dage, ikke inden for ugen. Målt på den
      # nuværende base ligger alle 5.195 tilbud inden i det vindue, så en stille
      # uge uden nye aviser kan ikke udløse det. Det kan kun en base helt uden
      # tilbudshistorik — og på den sti har synken alligevel intet at sende.
      - name: Priser — indtastede, gættede og opskriftspriser
        run: |
          npm run prices:import
          npm run prices:bootstrap
          npm run costs:recompute

      - name: Byg read-model og send til Supabase
        run: node src/sync/build.js

      # Selve detektionen skete ovenfor – build.js kører hver overvågning og
      # lægger rækker i notifications. Her leveres de. Uden dette trin opdager
      # man først, at en vare var på tilbud, når man tilfældigvis åbner appen.
      #
      # Trinnet må ikke kunne vælte kørslen: er Firebase ikke sat op, springer
      # send.js over og går pænt ud. Databasen skal stadig gemmes bagefter.
      - name: Send push til de enheder, der følger varerne
        if: always()
        continue-on-error: true
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: node src/push/send.js

      # WAL-filen skal foldes ind i data.db, ellers uploader vi en base uden
      # de nyeste skrivninger.
      #
      # if: always() er vigtig. Ingest og opskrifts-crawl kan tage en halv time,
      # og uden den blev hele det arbejde smidt væk, hver gang et senere trin
      # fejlede – næste kørsel startede så forfra på en tom base og fejlede på
      # ny. En delvist opdateret SQLite-base er stadig en gyldig base, så det er
      # altid bedre at gemme den end at kassere den.
      - name: Luk databasen af
        if: always()
        run: |
          if [ ! -f data.db ]; then echo "ingen data.db at gemme"; exit 0; fi
          node -e "
            const db=require('better-sqlite3')('data.db');
            db.pragma('wal_checkpoint(TRUNCATE)');
            db.close();
          "
          ls -lh data.db

      - name: Gem database til næste kørsel
        if: always()
        run: |
          if [ ! -f data.db ]; then echo "ingen data.db at gemme"; exit 0; fi
          gh release upload db data.db --clobber

      - name: Resumé
        run: |
          {
            echo "### Opdatering gennemført"
            echo ""
            node -e "
              const db=require('better-sqlite3')('data.db',{readonly:true});
              const q=s=>db.prepare(s).get().n;
              const now=new Date().toISOString();
              console.log('| Tal | |');
              console.log('|---|---|');
              console.log('| Tilbud i alt | '+q('SELECT COUNT(*) n FROM offers')+' |');
              console.log('| Aktive tilbud | '+db.prepare('SELECT COUNT(*) n FROM offers WHERE run_till IS NULL OR run_till>=?').get(now).n+' |');
              console.log('| Varetyper | '+q('SELECT COUNT(*) n FROM products')+' |');
              console.log('| Opskrifter | '+q('SELECT COUNT(*) n FROM recipes')+' |');
              console.log('| Uger med data | '+q(\"SELECT COUNT(DISTINCT year||'-'||week) n FROM offers\")+' |');
            "
          } >> $GITHUB_STEP_SUMMARY

      - name: Gem log som artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
